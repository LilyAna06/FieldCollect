name: field_monitor
description: >
  Offline-first ecological & cultural health field data collection app.
  Renders data-collection forms from JSON schemas (starting with the
  Rapid Habitat Assessment) and syncs captured records to Supabase
  when connectivity is available.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local storage (offline-first record store)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Identity / IDs (client-generated, so offline records never collide)
  uuid: ^4.4.0

  # Geospatial capture
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Connectivity + background-ish sync trigger
  connectivity_plus: ^7.3.0

  # Backend
  supabase_flutter: ^2.5.6

  # Media capture for photo fields
  image_picker: ^1.1.2

  # Misc
  intl: ^0.20.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/schemas/
